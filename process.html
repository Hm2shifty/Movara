<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design Process — Movara Portfolio</title>
  <meta name="description" content="Requirements identification, solution generation, morph charts, and existing product comparison for the Movara transfer bench." />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .req-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; margin-top: 48px; }
    .req-card {
      background: var(--white);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: var(--shadow-sm);
    }
    .req-card-header {
      display: flex; gap: 14px; align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-soft);
    }
    .req-card-icon { font-size: 1.5rem; }
    .req-card h4 { margin: 0; }

    .morph-selected {
      background: rgba(25,25,112,0.08);
      color: var(--midnight);
      font-weight: 700;
      border-radius: 4px;
      padding: 2px 8px;
    }
    .morph-alt { color: var(--muted-lt); }

    .comparison-score {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px;
      border-radius: 50%;
      font-weight: 700;
      font-size: 0.85rem;
    }
    .score-5 { background:#e8f8ef; color:#1a7340; }
    .score-4 { background:#eef5ff; color:#1a4a7a; }
    .score-3 { background:#f5f5f5; color:#555; }
    .score-2 { background:#fff8e8; color:#8a6000; }
    .score-1 { background:#fde8e8; color:#a01010; }
    .score-0 { background:#f0f0f0; color:#aaa; }

    .product-row-highlight td { background: rgba(25,25,112,0.04); font-weight: 500; }
    .product-row-highlight td:first-child { color: var(--midnight-deep); font-weight: 700; }

    .decisions-list { display: flex; flex-direction: column; gap: 20px; }

    @media (max-width: 768px) {
      .req-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav id="nav" role="navigation" aria-label="Main navigation"></nav>

  <!-- PAGE BANNER -->
  <header class="page-banner">
    <div class="container">
      <span class="section-label" id="banner-label"></span>
      <h1 id="banner-heading">Loading…</h1>
      <p class="lead" id="banner-lead"></p>
    </div>
  </header>

  <!-- REQUIREMENTS -->
  <section id="requirements">
    <div class="container">
      <div class="section-header" data-reveal>
        <span class="section-label" id="req-label"></span>
        <h2 id="req-heading"></h2>
        <div class="divider"></div>
        <p id="req-intro"></p>
      </div>
      <div class="req-grid" id="req-grid"></div>
    </div>
  </section>

  <!-- IDEATION -->
  <section id="ideation" style="background:var(--bg-soft);">
    <div class="container">
      <div class="two-col" style="align-items:start; gap:72px;">
        <div data-reveal>
          <span class="section-label" id="idea-label"></span>
          <h2 id="idea-heading"></h2>
          <div class="divider left" style="margin-bottom:24px;"></div>
          <p id="idea-body"></p>
        </div>
        <div data-reveal data-reveal-delay="2" id="idea-image-wrap">
          <div class="img-placeholder" style="height:340px; border-radius:var(--radius-md);">
            <span class="ph-icon">✏️</span>
            <span>Loading ideation image…</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- MORPH CHART -->
  <section id="morph-chart">
    <div class="container">
      <div class="section-header" data-reveal>
        <span class="section-label" id="morph-label"></span>
        <h2 id="morph-heading"></h2>
        <div class="divider"></div>
        <p id="morph-intro"></p>
      </div>
      <p id="morph-note" style="text-align:center; font-size:0.85rem; color:var(--muted); margin-bottom:28px;"></p>
      <div class="table-wrap" data-reveal>
        <table id="morph-table">
          <thead><tr id="morph-thead"></tr></thead>
          <tbody id="morph-tbody"></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- COMPARISON MATRIX -->
  <section id="comparison" style="background:var(--bg-soft);">
    <div class="container">
      <div class="section-header" data-reveal>
        <span class="section-label" id="comp-label"></span>
        <h2 id="comp-heading"></h2>
        <div class="divider"></div>
        <p id="comp-intro"></p>
      </div>
      <p id="comp-note" style="text-align:center; font-size:0.85rem; color:var(--muted); margin-bottom:28px;"></p>
      <div class="table-wrap" data-reveal>
        <table id="comp-table">
          <thead><tr id="comp-thead"></tr></thead>
          <tbody id="comp-tbody"></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- DESIGN DECISIONS -->
  <section id="decisions">
    <div class="container">
      <div class="section-header" data-reveal>
        <span class="section-label" id="dec-label">Design Decisions</span>
        <h2 id="dec-heading"></h2>
        <div class="divider"></div>
      </div>
      <div class="decisions-list" id="decisions-list"></div>
    </div>
  </section>

  <footer id="footer"></footer>

  <script src="js/nav.js"></script>
  <script src="js/loader.js"></script>
  <script>
    buildNav('process.html');
    buildFooter();

    function scoreClass(s) {
      if (s >= 5) return 'score-5';
      if (s >= 4) return 'score-4';
      if (s >= 3) return 'score-3';
      if (s >= 2) return 'score-2';
      if (s >= 1) return 'score-1';
      return 'score-0';
    }

    fetch('data/page3.json')
      .then(r => r.json())
      .then(d => {
        document.title = d.meta.title;

        // Banner
        document.getElementById('banner-label').textContent   = d.banner.section_label;
        document.getElementById('banner-heading').textContent = d.banner.heading;
        document.getElementById('banner-lead').textContent    = d.banner.lead;

        // Requirements
        document.getElementById('req-label').textContent   = d.requirements.section_label;
        document.getElementById('req-heading').textContent = d.requirements.heading;
        document.getElementById('req-intro').textContent   = d.requirements.intro;
        document.getElementById('req-grid').innerHTML = d.requirements.categories.map((cat, i) => `
          <div class="req-card" data-reveal data-reveal-delay="${i + 1}">
            <div class="req-card-header">
              <span class="req-card-icon">${cat.icon}</span>
              <h4>${cat.title}</h4>
            </div>
            <ul class="feature-list">
              ${cat.items.map(item => `<li>${item}</li>`).join('')}
            </ul>
          </div>
        `).join('');

        // Ideation
        document.getElementById('idea-label').textContent   = d.ideation.section_label;
        document.getElementById('idea-heading').textContent = d.ideation.heading;
        document.getElementById('idea-body').textContent    = d.ideation.body;
        const ideaWrap = document.getElementById('idea-image-wrap');
        ideaWrap.innerHTML = `
          <div class="img-placeholder" style="height:340px; border-radius:var(--radius-md);" id="idea-ph">
            <span class="ph-icon">✏️</span>
            <span>${d.ideation.image.placeholder}</span>
            <span style="font-size:0.72rem;opacity:0.6;">assets/diagrams/ folder</span>
          </div>`;
        const ideaImg = new Image();
        ideaImg.onload = () => { ideaWrap.innerHTML = `<img src="${d.ideation.image.src}" alt="${d.ideation.image.caption}" style="width:100%;border-radius:var(--radius-md);margin-bottom:10px;" /><p style="font-size:0.8rem;color:var(--muted);text-align:center;">${d.ideation.image.caption}</p>`; };
        ideaImg.src = d.ideation.image.src;

        // Morph Chart
        document.getElementById('morph-label').textContent   = d.morph_chart.section_label;
        document.getElementById('morph-heading').textContent = d.morph_chart.heading;
        document.getElementById('morph-intro').textContent   = d.morph_chart.intro;
        document.getElementById('morph-note').textContent    = d.morph_chart.note;
        document.getElementById('morph-thead').innerHTML = d.morph_chart.headers.map(h => `<th>${h}</th>`).join('');
        document.getElementById('morph-tbody').innerHTML = d.morph_chart.rows.map(row => `
          <tr>
            <td>${row.parameter}</td>
            ${row.options.map(opt => `<td class="${opt === row.selected ? '' : 'morph-alt'}">${opt === row.selected ? `<span class="morph-selected">${opt}</span>` : opt}</td>`).join('')}
            ${row.options.length < 3 ? '<td></td>'.repeat(3 - row.options.length) : ''}
            <td><span class="morph-selected">${row.selected}</span></td>
          </tr>
        `).join('');

        // Comparison Matrix
        document.getElementById('comp-label').textContent   = d.comparison_matrix.section_label;
        document.getElementById('comp-heading').textContent = d.comparison_matrix.heading;
        document.getElementById('comp-intro').textContent   = d.comparison_matrix.intro;
        document.getElementById('comp-note').textContent    = d.comparison_matrix.note;

        const compHead = document.getElementById('comp-thead');
        compHead.innerHTML = `<th>Product</th>` + d.comparison_matrix.criteria.map(c => `<th>${c}</th>`).join('') + `<th>Avg</th>`;

        document.getElementById('comp-tbody').innerHTML = d.comparison_matrix.products.map(prod => {
          const nonZero = prod.scores.filter(s => s > 0);
          const avg = nonZero.length ? (nonZero.reduce((a, b) => a + b, 0) / nonZero.length).toFixed(1) : '—';
          return `
            <tr class="${prod.highlight ? 'product-row-highlight' : ''}">
              <td>${prod.highlight ? '★ ' : ''}${prod.name}</td>
              ${prod.scores.map(s => `<td><span class="comparison-score ${scoreClass(s)}">${s || '—'}</span></td>`).join('')}
              <td><strong>${avg}</strong></td>
            </tr>`;
        }).join('');

        // Decisions
        document.getElementById('dec-heading').textContent = d.decision_rationale.heading;
        document.getElementById('decisions-list').innerHTML = d.decision_rationale.decisions.map(dec => `
          <div class="accordion-item" data-reveal>
            <div class="accordion-header">
              <h4>${dec.title}</h4>
              <span class="accordion-arrow">▾</span>
            </div>
            <div class="accordion-body">
              <p style="padding-top:4px;">${dec.body}</p>
            </div>
          </div>
        `).join('');

        initReveal();
        initAccordions();
      })
      .catch(err => console.error('Failed to load page3.json:', err));
  </script>
</body>
</html>
